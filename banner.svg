<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1e"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0.1" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0.85" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#glow-left)"/>
  <rect width="1200" height="400" fill="url(#glow-right)"/>

  <!-- Decorative code symbols -->
  <text x="75" y="130" font-family="'Fira Code', 'Courier New', monospace" font-size="95" font-weight="600" fill="#38bdf8" opacity="0.18">&lt;/&gt;</text>
  <text x="1035" y="325" font-family="'Fira Code', 'Courier New', monospace" font-size="80" font-weight="600" fill="#c084fc" opacity="0.18">{ }</text>

  <!-- Decorative geometric accents -->
  <circle cx="1090" cy="80" r="48" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.45"/>
  <circle cx="1090" cy="80" r="74" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.22"/>
  <circle cx="95" cy="320" r="36" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.45"/>
  <circle cx="95" cy="320" r="56" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.22"/>

  <!-- Small floating nodes / constellation effect -->
  <circle cx="280" cy="70" r="3" fill="#38bdf8" opacity="0.4"/>
  <circle cx="920" cy="110" r="3.5" fill="#c084fc" opacity="0.5"/>
  <circle cx="340" cy="340" r="2.5" fill="#818cf8" opacity="0.35"/>
  <circle cx="860" cy="330" r="3" fill="#38bdf8" opacity="0.4"/>

  <!-- Greeting -->
  <text x="600" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#94a3b8" letter-spacing="7">HELLO WORLD, I'M</text>

  <!-- Name with modern gradient -->
  <text x="600" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="url(#accent)" letter-spacing="1">Nidhal Boumaiza</text>

  <!-- Tagline -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#f1f5f9">Software Engineer &#183; Flutter &amp; Mobile &#183; Full-Stack Developer</text>

  <!-- Divider line -->
  <rect x="470" y="295" width="260" height="4" rx="2" fill="url(#accent)"/>

  <!-- Location & Availability -->
  <text x="600" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Based in Tunis, Tunisia &#183; Open to On-site, Hybrid &amp; Remote Roles</text>
</svg>
